<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作流增强 · 交互示意</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#20252e;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dfe3eb;border-radius:8px;padding:8px 12px;background:#fff;color:inherit}button:hover{background:#f0f4ff}button:disabled{opacity:.4;cursor:default}.primary{background:#2563eb;color:white;border-color:#2563eb}.primary:hover{background:#1d4ed8}.notice{padding:9px 24px;background:#eef3ff;color:#506087;font-size:12px}header{display:flex;gap:10px;align-items:center;padding:16px 24px;background:white;border-bottom:1px solid #e5e7eb}h1{font-size:20px;margin:0}header small{color:#87909e}header .spacer{flex:1}.wrap{padding:32px;max-width:1250px;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{padding:24px;border:1px solid #e3e7ee;border-radius:12px;background:white;text-align:left}.card strong{display:block;font-size:16px;margin:12px 0}.card p{color:#76808e;font-size:13px}.tag{font-size:11px;color:#2563eb;background:#edf2ff;border-radius:4px;padding:3px 7px}.work{height:calc(100vh - 107px);display:grid;grid-template-columns:minmax(350px,1fr) 330px}.canvas{position:relative;overflow:auto;background-image:radial-gradient(#d1d5db 1px,transparent 1px);background-size:20px 20px}.tools{position:absolute;top:18px;left:20px;display:flex;gap:8px;z-index:2}.flow{display:flex;gap:40px;align-items:center;margin:150px 40px 40px;min-width:750px}.node{position:relative;min-width:160px;background:white;border:1px solid #d7dde8;box-shadow:0 4px 14px #1b274309;border-radius:11px;padding:16px;text-align:left}.node small{display:block;color:#8a94a3}.node:not(:last-child):after{content:'⟶';position:absolute;right:-32px;top:20px;color:#9ca3af;font-size:22px}.node.selected{outline:2px solid #2563eb}.node.error{border-color:#dc2626}.node .status{font-size:11px;color:#15803d}.side{background:white;border-left:1px solid #e3e7ee;padding:22px;overflow:auto}.side h2{font-size:16px}.side label{display:block;font-size:12px;color:#6b7280;margin:16px 0 5px}.side input,.side textarea,.search{width:100%;border:1px solid #dfe3eb;border-radius:7px;padding:9px;background:white}.side textarea{min-height:95px;resize:vertical}.hint{color:#8b95a5;font-size:12px}.tabs{display:flex;gap:8px;border-bottom:1px solid #e5e7eb;padding-bottom:12px}.tabs button{border:none}.tabs button[aria-selected=true]{color:#2563eb;background:#edf2ff}pre{white-space:pre-wrap;word-break:break-all;background:#f6f7f9;border-radius:8px;padding:12px;font-size:12px}.issue{display:block;width:100%;color:#b42318;text-align:left;margin:10px 0;background:#fff6f4}.palette{position:absolute;left:20px;top:65px;width:270px;border:1px solid #dfe3eb;box-shadow:0 12px 30px #29314419;padding:16px;border-radius:10px;background:white;z-index:5}.palette button{display:block;width:100%;text-align:left;margin-top:6px;border:0}.palette h4{margin:10px 0;color:#87909e;font-size:12px}.bottom{position:absolute;bottom:20px;left:20px;color:#8590a1;font-size:12px}.hidden{display:none!important}dialog{border:1px solid #e5e7eb;border-radius:14px;width:460px;padding:24px;box-shadow:0 20px 80px #10182830}dialog::backdrop{background:#10182860}dialog input{padding:10px;width:100%;border:1px solid #ddd;border-radius:7px;margin:12px 0}#toast{position:fixed;bottom:20px;right:20px;background:#202937;color:white;border-radius:9px;padding:12px 20px;z-index:10}#empty{color:#8b95a5;padding:25px 0}#list h2{font-size:15px;color:#6b7280;margin-bottom:22px}.variable{width:100%;text-align:left;margin:10px 0}.variable small{display:block;color:#8290a1}.values{border-top:1px solid #e5e7eb;margin-top:20px;padding-top:15px}@media(max-width:850px){header{flex-wrap:wrap;padding:12px}.work{grid-template-columns:1fr;height:auto}.canvas{min-height:330px}.side{border-top:1px solid #ddd;border-left:0}.flow{margin-top:110px}.wrap{padding:20px}.hide-mobile{display:none}.tools{left:12px}header button{padding:6px 9px}header h1{font-size:17px}}
</style><div class="notice">产品交互 Demo · WF-D01～08 · 数据为模拟，未连接模型或后端；不改变当前平台。</div><header><button id="back" class="hidden" onclick="home()">← 工作流</button><h1 id="title">工作流</h1><small id="subtitle">从场景开始，按节点验证</small><span class="spacer"></span><span id="actions" class="hidden"><button id="undo" onclick="undo()" disabled>撤销</button> <button id="redo" onclick="redo()" disabled>重做</button> <button onclick="organize()">整理</button> <button onclick="check()">检查流程</button> <button onclick="toast('示意：保存草稿，保留修订冲突保护')">保存</button> <button class="primary" onclick="run()">测试运行</button></span></header>
<main id="list" class="wrap"><h2>选择模板创建工作流</h2><div class="cards" id="templates"></div><p class="hint">已有工作流仍以列表展示；创建后进入独立画布。需要模型的模板将在创建时选择当前账号可用模型。</p></main>
<main id="studio" class="work hidden"><section class="canvas"><div class="tools"><button onclick="togglePalette()">＋ 添加节点</button><button onclick="tab('variables')">变量检查</button></div><div id="palette" class="palette hidden"><input class="search" aria-label="搜索节点" placeholder="搜索节点名或用途" oninput="palette(this.value)"><div id="paletteItems"></div></div><div id="flow" class="flow"></div><div class="bottom">100%　·　画布运行状态来自原查询方式，工作流不新增 SSE</div></section><aside class="side"><div class="tabs"><button data-tab="config" aria-selected="true" onclick="tab('config')">配置</button><button data-tab="check" aria-selected="false" onclick="tab('check')">检查</button><button data-tab="variables" aria-selected="false" onclick="tab('variables')">变量</button></div><div id="panel"></div></aside></main>
<dialog id="create"><h2 id="templateTitle">创建工作流</h2><label for="name">工作流名称</label><input id="name" value="客户资料报告"><p class="hint" id="templateInfo"></p><button onclick="document.querySelector('#create').close()">取消</button> <button class="primary" onclick="create()">创建并编辑</button></dialog><div id="toast" class="hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s);const templates=[['blank','空白流程','从开始和结束节点搭建你的流程','2节点 · 自由编排'],['llm','AI 问答','输入问题，模型生成回答','3节点 · 需选择聊天模型'],['json','JSON 字段提取','从 customer.name 提取客户名','3节点 · 无模型调用'],['condition','关键词分流','根据内容走不同处理路径','6节点 · 无模型调用'],['report','模板报告','组合输入与已提取的客户名','4节点 · 无模型调用']];let chosen='report',selected='extract',nodes=[],history=[],future=[],currentTab='config',completed=false;const initial=[{id:'start',name:'开始',kind:'流程输入'},{id:'extract',name:'提取客户名',kind:'JSON 字段提取'},{id:'report',name:'模板报告',kind:'模板组合'},{id:'end',name:'结束',kind:'最终输出'}];
for(const t of templates){const b=document.createElement('button');b.className='card';b.innerHTML='<span class="tag">'+t[3]+'</span><strong>'+t[1]+'</strong><p>'+t[2]+'</p><span>使用模板 →</span>';b.onclick=()=>{chosen=t[0];$('#templateTitle').textContent='创建 · '+t[1];$('#templateInfo').textContent=t[3]+'。真实页面将在创建时校验模型与资源归属。';$('#create').showModal();};$('#templates').append(b);}
function create(){nodes=structuredClone(initial);history=[];future=[];completed=false;$('#create').close();$('#title').textContent=$('#name').value||'未命名流程';$('#subtitle').textContent='草稿修订 1 · 交互示意';$('#list').classList.add('hidden');$('#studio').classList.remove('hidden');$('#actions').classList.remove('hidden');$('#back').classList.remove('hidden');render();tab('config');toast('示意：已选择'+templates.find(t=>t[0]===chosen)[1]+'，此 Demo 统一展示报告配置');}
function home(){$('#list').classList.remove('hidden');$('#studio').classList.add('hidden');$('#actions').classList.add('hidden');$('#back').classList.add('hidden');$('#title').textContent='工作流';$('#subtitle').textContent='从场景开始，按节点验证';}
function render(){$('#flow').replaceChildren();for(const n of nodes){const b=document.createElement('button');b.className='node'+(n.id===selected?' selected':'');b.dataset.node=n.id;b.innerHTML='<strong>'+n.name+'</strong><small>'+n.kind+'</small>'+(completed?'<span class="status">✓ 成功 · 2ms</span>':'');b.onclick=()=>{selected=n.id;render();tab('config');};$('#flow').append(b);}$('#undo').disabled=!history.length;$('#redo').disabled=!future.length;}
function save(){history.push(structuredClone(nodes));history=history.slice(-40);future=[];completed=false;}
function undo(){if(!history.length)return;future.push(structuredClone(nodes));nodes=history.pop();render();tab('config');}
function redo(){if(!future.length)return;history.push(structuredClone(nodes));nodes=future.pop();render();tab('config');}
function organize(){save();nodes.sort((a,b)=>a.id==='start'?-1:b.id==='start'?1:a.id==='end'?1:b.id==='end'?-1:0);render();toast('示意：按依赖层级整理，连线和参数语义保留');}
function togglePalette(){$('#palette').classList.toggle('hidden');palette('');}
const kinds=[['AI 与知识','大语言模型','llm'],['AI 与知识','知识检索','rag'],['数据与逻辑','条件分支','condition'],['数据与逻辑','JSON 字段提取','json_get'],['数据与逻辑','模板组合','template'],['工具与人工','HTTP 请求','http'],['工具与人工','人工审批','approval']];
function palette(q){$('#paletteItems').replaceChildren();let group='',count=0;for(const k of kinds.filter(v=>v.join(' ').toLowerCase().includes(q.toLowerCase()))){if(group!==k[0]){const h=document.createElement('h4');h.textContent=k[0];$('#paletteItems').append(h);group=k[0];}const b=document.createElement('button');b.textContent=k[1];b.onclick=()=>{save();const id='node'+Date.now();nodes.splice(nodes.length-1,0,{id,name:k[1],kind:k[2]});selected=id;render();tab('config');$('#palette').classList.add('hidden');};$('#paletteItems').append(b);count++;}if(!count)$('#paletteItems').textContent='没有匹配节点，请更换关键词';}
function tab(name){currentTab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));const p=$('#panel');p.replaceChildren();const add=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;p.append(e);return e;};const button=(text,click,cls)=>{const b=add('button',text,cls);b.onclick=click;return b;};if(name==='check'){add('h2','流程检查');add('p','配置检查与资源实时可用性分开；检查不会调用模型。','hint');button('模板报告 · 模板内容尚未填写 · 点击定位节点并修正',locate,'issue');button('重新检查',()=>toast('示意：后端重新检查当前草稿'));return;}if(name==='variables'){add('h2','运行变量');if(!completed){add('p','尚未运行；不会伪造成功输出。','hint');button('测试运行（模拟）',run,'primary');return;}add('p','来源：本次模拟运行 · 草稿修订1；原记录只读，复用只填入新测试值。','hint');for(const [id,label] of [['input','流程输入 · JSON'],['extract','提取客户名 · 成功 · 小林'],['report','模板报告 · 成功']])button(label,()=>showValue(id),'variable');const v=add('div','');v.id='value';return;}const n=nodes.find(n=>n.id===selected)||nodes[0];add('h2',n.name);add('label','输入来源');button('流程输入 ▾',()=>toast('仅列根输入和必经前置节点；兼容旧开始输出'));add('p','按执行依赖选择，不会自动运行其他节点','hint');if(n.id==='extract'){add('label','字段路径');const i=add('input','');i.setAttribute('aria-label','字段路径');i.value='customer.name';add('p','支持点分字段与数组索引，例如 items.0.title','hint');}else if(n.id==='report'){add('label','模板内容');const t=add('textarea','');t.setAttribute('aria-label','模板内容');t.value='客户：{{extract}}\n原始资料：{{input}}';button('＋ 插入变量',insertVariable);add('p','仅固定占位符，不支持脚本或表达式。','hint');}button('测试此节点',()=>toast('示意：只测试此节点，代码和人工确认仍须审批'),'primary');add('p','单节点成功不会解锁整图发布。','hint');}
function insertVariable(){const t=$('[aria-label="模板内容"]');if(t)t.value+='\n{{extract}}';toast('插入必经上游节点的变量引用');}
function check(){tab('check');toast('示例检查结果，点击问题定位');}
function locate(){selected='report';render();tab('config');$('#flow [data-node="report"]').scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});toast('已定位模板报告节点');}
function run(){completed=true;render();tab('variables');toast('模拟运行完成：可检查变量并复用为单节点测试输入');}
function showValue(id){const value=id==='input'?'{"customer":{"name":"小林"}}':id==='extract'?'小林':'客户：小林';$('#value').replaceChildren();const pre=document.createElement('pre');pre.textContent=value;$('#value').append(pre);const b=document.createElement('button');b.textContent='填入所选节点测试值';b.onclick=()=>toast('示意：复制到可编辑测试值，原运行不变；须明确点击测试');$('#value').append(b);}
let timer;function toast(t){clearTimeout(timer);$('#toast').textContent=t;$('#toast').classList.remove('hidden');timer=setTimeout(()=>$('#toast').classList.add('hidden'),3500);}
</script></html>
