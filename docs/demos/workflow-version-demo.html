<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行 · 工作流版本管理示意</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#262626;background:#f7f7f8}button,input,textarea{font:inherit}button{background:#fff;border:1px solid #e1e1e5;padding:8px 12px;border-radius:8px;cursor:pointer}button:hover{background:#f0f2f5}button:disabled{opacity:.45;cursor:default}.primary{background:#1f2937;color:white}header{padding:18px 26px;background:white;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}.spacer{flex:1}.hint{font-size:12px;color:#737780}.banner{background:#edf3ff;color:#51627e;padding:8px 26px;font-size:12px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 125px)}.canvas{padding:34px;overflow:auto;background-image:radial-gradient(#d4d4d8 1px,transparent 1px);background-size:20px 20px}.flow{display:flex;gap:26px;margin:85px 0 45px;min-width:600px}.node{padding:20px;background:white;border:1px solid #d8dce1;border-radius:12px;min-width:160px;box-shadow:0 3px 15px #00000005}.node small{display:block;color:#8a8e96}.side{padding:22px;background:white;border-left:1px solid #e5e5e7;overflow:auto}.side h2{font-size:16px;margin:0 0 6px}.version{display:block;width:100%;text-align:left;margin:12px 0;padding:13px}.version[aria-pressed=true]{border-color:#3d6ec9;background:#f0f5ff}.version small{display:block;color:#848894}.badge{font-size:11px;padding:3px 6px;border-radius:5px;background:#edf3ff;color:#3064b2}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}label{display:block;font-size:12px;color:#6a7078;margin:12px 0 5px}textarea{width:100%;min-height:90px;padding:12px;border:1px solid #ddd;border-radius:8px;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5f7;padding:12px;border-radius:8px;font-size:12px}.status{margin:15px 0;color:#497055;font-size:12px}.copies{padding:12px;background:#fff;border:1px solid #e4e4e7;border-radius:8px;margin-top:20px}.hidden{display:none}dialog{width:min(470px,calc(100vw - 30px));border:1px solid #ddd;border-radius:14px;padding:25px}dialog::backdrop{background:#17233366}dialog input{width:100%;padding:9px;border:1px solid #ddd;border-radius:7px}@media(max-width:760px){.grid{grid-template-columns:1fr;height:auto}.side{border-top:1px solid #ddd}.canvas{padding:20px;min-height:360px}.flow{margin-top:40px}header{padding:14px}.spacer{display:none}.flow{min-width:580px}.banner{padding:8px 14px}}</style><div class="banner">产品交互 Demo · WVR-01～08 · 无网络、无模型、全部模拟数据，不改变平台。</div><header><h1>客户报告工作流</h1><span id="draftBadge" class="hint"></span><span class="spacer"></span><button onclick="edit()">返回编辑草稿</button><button id="save" onclick="save()">保存草稿</button><button onclick="runCurrent()">运行当前发布版</button><strong id="current" class="badge"></strong></header><main class="grid"><section class="canvas"><div id="mode" class="badge"></div><div id="layoutNote" class="hint"></div><div class="flow"><div class="node">开始<small>用户输入</small></div><div class="node" id="middle"></div><div class="node">结束<small>报告输出</small></div></div><label for="instruction">模型指令 / 草稿内容</label><textarea id="instruction" oninput="local=this.value;dirty=true;render()"></textarea><p id="notice" class="status" role="status"></p><div id="copies" class="copies"><strong>独立草稿与恢复备份</strong><div id="copyList"></div></div><pre id="log">暂无操作。这里展示模拟请求语义。</pre></section><aside class="side"><h2>版本历史</h2><p class="hint">草稿、发布历史与唯一当前发布版分开。运行记录在另一入口。</p><div id="versions"></div><div id="detail"></div></aside></main><dialog id="restore"><h2>恢复为草稿</h2><p id="restoreText"></p><p class="hint">如有本地修改先CAS保存；恢复事务原子创建当前草稿备份再恢复旧版。失败不覆盖，也不留下假成功备份。</p><div class="actions"><button onclick="closeRestore()">取消</button><button class="primary" onclick="restore()">保存、备份并恢复</button></div></dialog><dialog id="copy"><h2>复制为新工作流</h2><label for="copyName">新工作流名称</label><input id="copyName" maxlength="100"><p class="hint">不复制已测试标记、发布版本、Key或运行记录；原未保存编辑保留，不自动跳走。</p><div class="actions"><button onclick="closeCopy()">取消</button><button class="primary" onclick="copy()">创建独立草稿</button></div></dialog><script>
const $=s=>document.querySelector(s);let selected=null,current=2,releaseRevision=4,revision=7,tested=7,local='草稿：补充中文报告的风险说明',stored=local,dirty=false,copies=[];const versions=[{version:3,active:false,text:'v3：实验版报告',layout:true},{version:2,active:true,text:'v2：标准客户报告',layout:true},{version:1,active:true,text:'v1：简洁客户报告',layout:false}];
function render(){ $('#current').textContent=current?'当前发布 v'+current:'尚未指定当前发布版';$('#draftBadge').textContent='草稿修订 '+revision+(dirty?' · 有未保存修改':tested===revision?' · 已整体测试':' · 待重新测试');$('#mode').textContent=selected?'历史 v'+selected.version+' · 只读预览':'编辑草稿';$('#instruction').readOnly=!!selected;$('#instruction').value=selected?selected.text:local;$('#save').disabled=!!selected;$('#middle').replaceChildren();const name=document.createElement('strong');name.textContent=selected?'历史模型配置 v'+selected.version:'当前草稿模型';const sub=document.createElement('small');sub.textContent='节点参数、Schema与布局属于各自快照';$('#middle').append(name,sub);$('#layoutNote').textContent=selected&&!selected.layout?'此版本未保存自定义布局，按默认位置展示':'';$('#versions').replaceChildren();for(const v of versions){const b=document.createElement('button');b.className='version';b.setAttribute('aria-pressed',String(selected===v));b.textContent='v'+v.version+' · '+(current===v.version?'当前发布版':v.active?'可用历史':'已下线');b.onclick=()=>{selected=v;render();};$('#versions').append(b);}const d=$('#detail');d.replaceChildren();if(selected){const p=document.createElement('pre');p.textContent=selected.text;d.append(p);const a=document.createElement('div');a.className='actions';function btn(t,fn,disabled=false){const b=document.createElement('button');b.textContent=t;b.onclick=fn;b.disabled=disabled;a.append(b);}btn('恢复为草稿',()=>{$('#restoreText').textContent='把 v'+selected.version+' 恢复为新草稿，当前草稿将另存为独立备份。'+(dirty?'本地未保存修改会先保存，保存失败不继续。':'');$('#restore').showModal();});btn('复制为新工作流',()=>{$('#copyName').value='客户报告 - v'+selected.version+' 副本';$('#copy').showModal();});btn('设为当前发布版',()=>{current=selected.version;releaseRevision++;note('已切换当前发布版。草稿、API Key和原运行固定版本均未改变。','POST /versions/'+current+'/set-current {release_revision:'+ (releaseRevision-1)+'}');render();},!selected.active||current===selected.version);btn(selected.active?'下线版本':'重新上线',()=>{selected.active=!selected.active;if(!selected.active&&current===selected.version){current=null;releaseRevision++;}note('可用状态更新，不自动回退或自动指定当前版。','PUT /versions/'+selected.version+'/state');render();});d.append(a);}$('#copyList').replaceChildren();for(const c of copies){const row=document.createElement('div');const b=document.createElement('button');b.textContent=c.name+' · 查看';b.onclick=()=>note(c.text,'独立未发布草稿可找回；当前原编辑不被切走。');row.append(b);$('#copyList').append(row);} }
function note(text,log){$('#notice').textContent=text;$('#log').textContent=log||text;}
function edit(){selected=null;render();}
function save(){if(selected)return;stored=local;if(dirty){revision++;tested=null;}dirty=false;note('当前草稿已保存。');render();}
function closeRestore(){$('#restore').close();}function closeCopy(){$('#copy').close();}
function restore(){if(!selected)return;if(dirty)save();const from=selected.version;copies.push({name:'恢复前草稿备份 - r'+revision,text:stored});local=stored=selected.text;revision++;tested=null;selected=null;dirty=false;closeRestore();note('已原子备份并恢复为新草稿；重新整体测试后才能发布。当前发布版未改变。','POST /versions/'+from+'/restore {revision:'+(revision-1)+'} → workflow + backup_id/name');render();}
function copy(){if(!selected||!$('#copyName').value.trim())return;copies.push({name:$('#copyName').value.trim(),text:selected.text});closeCopy();note('副本已创建，当前本地草稿保留；打开前先保存原编辑。','POST /versions/'+selected.version+'/copy {name:...}');render();}
function runCurrent(){if(!current){note('尚未指定可用当前发布版，请在历史中选择。');return;}selected=versions.find(v=>v.version===current);note('明确预选 v'+current+'，草稿测试是另一入口。此Demo不会实际执行。','POST /versions/'+current+'/runs（固定版本，不自动重定向Key）');render();}render();
</script></html>
