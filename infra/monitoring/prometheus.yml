global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules.yml
scrape_configs:
  - job_name: owner-agent
    metrics_path: /api/v1/internal/observability/metrics
    scrape_timeout: 10s
    sample_limit: 200
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [host.docker.internal:8100]
