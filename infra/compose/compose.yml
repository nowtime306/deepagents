name: owner-agent
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置独立数据库密码}
      POSTGRES_DB: owner_agent
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - owner_agent_pg:/var/lib/postgresql
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d owner_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  owner_agent_pg:
