<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知行 · 知识库体验 Demo</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#292724;background:#f8f8f7;font-size:14px;--accent:#b6422d;--muted:#79736d;--line:#e6e3df}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;color:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 13px}button:hover{background:#f5f2ef}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#9e3927}input,select,textarea{background:white;border:1px solid var(--line);border-radius:8px;padding:11px;color:inherit;max-width:100%}input:focus,textarea:focus,button:focus-visible{outline:2px solid #cc7e6a;outline-offset:2px}textarea{width:100%;min-height:110px;resize:vertical}label{display:grid;gap:9px;font-size:13px;margin:15px 0}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{background:#f0efed;border-right:1px solid var(--line);padding:26px 15px}.brand{font-size:24px;font-weight:700;margin:0 12px 32px}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:8px}aside p{color:#827b74;font-size:11px;padding:0 12px;margin-top:30px}aside button{display:block;border:0;background:none;width:100%;text-align:left;margin:4px 0}.selected{background:#f3e4df!important;color:#a63825!important}main{min-width:0}header.top{display:flex;justify-content:space-between;gap:12px;padding:18px 28px;background:white;border-bottom:1px solid var(--line);align-items:center}.badge{display:inline-flex;border:1px solid var(--line);border-radius:6px;padding:4px 7px;color:var(--muted);font-size:11px}.demo{background:#fcf4df;border:1px solid #e8d7a8;color:#7b6632;padding:10px 28px;font-size:12px}.frame{max-width:1270px;margin:auto;padding:30px 38px}.eyebrow{color:var(--muted);font-size:12px;margin:0 0 13px}h1{font-size:28px;margin:0 0 10px;letter-spacing:-1px}h2{font-size:18px;margin:0}h3{font-size:14px}p{line-height:1.7}.sub{color:var(--muted);font-size:13px}.heading,.toolbar,.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.heading{margin-bottom:26px}.toolbar{margin:24px 0;flex-wrap:wrap}.toolbar input{min-width:220px;flex:1;max-width:460px}.toolbar small{color:var(--muted)}.library{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.kb{border:1px solid var(--line);border-radius:12px;background:white;padding:22px;text-align:left;min-width:0;display:block}.kb:hover{border-color:#cbb9ad}.kb .symbol{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:#f4eee8;color:#90674c;margin-bottom:18px;font-size:21px}.kb h2{font-size:17px;overflow-wrap:anywhere}.kb p{font-size:12px;color:var(--muted);min-height:42px}.kb footer{border-top:1px solid #eee;padding-top:15px;margin-top:18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-radius:0;background:none;padding:14px 0;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent}.tabs button.active{color:#9f3b28;border-color:var(--accent);font-weight:600}.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;color:var(--muted);font-size:12px}.doc-list{background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden}.doc-header,.doc-row{display:grid;grid-template-columns:minmax(180px,1fr) 125px 105px 155px;gap:15px;padding:18px;align-items:center}.doc-header{background:#f5f4f2;padding-top:12px;padding-bottom:12px;font-size:11px;color:var(--muted)}.doc-row+.doc-row{border-top:1px solid #eee}.file-title{background:none;border:0;padding:0;text-align:left;font-weight:600;overflow-wrap:anywhere}.doc-row small{display:block;font-size:11px;color:var(--muted);margin-top:7px}.status{font-size:11px;width:fit-content;border-radius:5px;padding:5px 7px;background:#eef4ef;color:#4d7458}.status.warn{background:#faf0df;color:#976c23}.status.fail{background:#fbece8;color:#a34633}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:11px;padding:6px 8px}.section{border:1px solid var(--line);border-radius:10px;padding:23px;background:white;margin-bottom:18px}.section p{color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns: minmax(220px,.8fr) minmax(0,1.2fr);gap:22px}.empty{text-align:center;padding:70px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:white}.empty h2{color:#292724;margin-bottom:10px}.result{padding:17px;border:1px solid var(--line);border-radius:8px;background:white;margin:12px 0}.result small{color:var(--muted);font-size:11px}.result p{font-size:13px}.link{border:0;padding:0;color:#9f3b28;background:none}.state-bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:11px;color:#86775f;margin-top:7px}.state-bar select{padding:4px;font-size:11px}.note{padding:12px;border-radius:7px;background:#f7f5f1;color:#776d61;font-size:12px;line-height:1.8}.skeleton{height:16px;background:#eceae7;border-radius:5px;margin:22px 0}.skeleton:last-child{width:60%}dialog{border:1px solid var(--line);border-radius:13px;width:min(560px,calc(100% - 30px));padding:25px;color:inherit}dialog::backdrop{background:#25232166}dialog footer{display:flex;justify-content:flex-end;gap:8px;margin-top:25px}dialog .close{float:right;border:0;padding:0;background:none;font-size:21px}pre{font:13px/1.9 inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f6f4;padding:15px;border-radius:7px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#34312e;color:white;padding:13px 20px;border-radius:9px;max-width:90%;font-size:13px;z-index:5}[hidden]{display:none!important}@media(max-width:1000px){.library{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:160px minmax(0,1fr)}.frame{padding:25px}.doc-header,.doc-row{grid-template-columns:minmax(150px,1fr) 100px 80px}.doc-header>:last-child,.doc-row>:last-child{grid-column:1/-1}.split{grid-template-columns:1fr}}@media(max-width:600px){.shell{display:block}aside{display:none}.frame{padding:22px 16px}header.top{padding:15px 16px}.demo{padding:10px 16px}.library{grid-template-columns:1fr}.heading{align-items:flex-start;flex-wrap:wrap;gap:15px}.heading h1{font-size:24px}.toolbar{gap:10px}.toolbar input{min-width:0;width:100%;max-width:none;flex-basis:100%}.doc-header{display:none}.doc-row{grid-template-columns:minmax(0,1fr) 100px}.doc-row>:nth-child(3){grid-column:1/-1}.tabs{gap:20px}button{min-height:35px}.row{align-items:flex-start;flex-wrap:wrap}.stats{gap:10px}dialog{padding:20px}.badge{max-width:160px}}
</style>
<body>
<div class="shell"><aside><div class="brand">知行<small>智能体工作台</small></div><button>＋ 新建对话</button><p>工作空间</p><button>智能对话</button><button>任务工作台</button><button>工作流</button><p>资源与能力</p><button class="selected">知识库</button><button>MCP 工具</button><button>Skills 技能</button><button>长期记忆</button><p>管理与配置</p><button>设置</button></aside><main>
<header class="top"><strong>能力中心 / 知识库</strong><span class="badge">交互设计 Demo</span></header>
<div class="demo"><strong>样例演示</strong> · 所有资料、状态和结果均为样例，不连接真实接口，刷新即重置。<div class="state-bar">场景预览 <select id="scenario" aria-label="演示状态"><option value="normal">正常</option><option value="empty">空数据</option><option value="loading">加载中</option><option value="error">加载失败</option><option value="readonly">只读权限</option></select><span id="scenario-note"></span></div></div>
<div class="frame" id="app"></div></main></div>
<dialog id="modal"><button class="close" aria-label="关闭弹窗" onclick="closeModal()">×</button><div id="modal-content"></div></dialog><div class="toast" role="status" id="toast" hidden></div>
<script>
const libraries=[{name:'文学与阅读',description:'阅读笔记、书籍资料与写作参考。',model:'BAAI/bge-m3',bound:true},{name:'产品帮助中心',description:'产品使用指南、常见问题与售后规则。',model:'仅关键词检索',bound:false},{name:'团队技术资料',description:'接口设计、开发约定与部署手册。',model:'BAAI/bge-m3',bound:false}];
const sampleDocs=[{name:'长安的荔枝 · 阅读资料.txt',size:'271 KB',chunks:139,revision:1,status:'ready'},{name:'读书笔记.md',size:'18 KB',chunks:12,revision:2,status:'keyword'},{name:'扫描资料.pdf',size:'920 KB',chunks:0,revision:1,status:'failed'}];
let current=null,tab='文档',query='',filter='all',docs=structuredClone(sampleDocs),scenario='normal',retrieved=false;const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const readonly=()=>scenario==='readonly';const disabled=()=>readonly()?'disabled':'';const statusNames={ready:'向量就绪',keyword:'关键词可用',failed:'需要处理',uploading:'正在处理'};
function notify(text){const toast=document.querySelector('#toast');toast.textContent=text;toast.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.hidden=true,4000)}
function openModal(html){document.querySelector('#modal-content').innerHTML=html;modal.showModal()}function closeModal(){modal.close()}
function openLibrary(index){current=index;tab='文档';query='';filter='all';retrieved=false;docs=libraries[index].empty?[]:structuredClone(sampleDocs);render()}
function back(){current=null;query='';render()}function setTab(value){tab=value;query='';render()}
function render(){document.querySelector('#scenario-note').textContent=readonly()?'仅演示读取权限；管理操作已禁用。':'';
 if(current===null){const list=libraries.map((item,index)=>({...item,index})).filter(item=>(item.name+item.description).includes(query));app.innerHTML=`<p class="eyebrow">工作空间 / 资源与能力</p><div class="heading"><div><h1>知识库</h1><p class="sub">把资料整理好，让助手回答得有据可查。</p></div><button class="primary" ${disabled()} onclick="createLibrary()">＋ 新建知识库</button></div><div class="toolbar"><input aria-label="搜索知识库" placeholder="搜索知识库名称或描述" value="${esc(query)}" oninput="query=this.value;renderWithFocus('搜索知识库')"><small>共 ${scenario==='empty'?0:list.length} 个知识库</small></div>${specialState()||`<div class="library">${list.map(item=>`<button class="kb" onclick="openLibrary(${item.index})"><span class="symbol">▤</span><h2>${esc(item.name)}</h2><p>${esc(item.description)}</p><span class="badge">${esc(item.model)}</span><footer><span>${item.empty?0:3} 个文档 · 样例</span><span>${item.bound?'已供通用助手使用':'尚未绑定助手'} →</span></footer></button>`).join('')||'<div class="empty">没有匹配的知识库，试试其他关键词。</div>'}</div>`}`;return}
 const kb=libraries[current];app.innerHTML=`<p class="eyebrow"><button class="link" onclick="back()">← 返回知识库</button></p><div class="heading"><div><h1>${esc(kb.name)}</h1><p class="sub">${esc(kb.description)}</p><div class="stats"><span>${docs.length} 个文档</span><span>${docs.reduce((n,d)=>n+d.chunks,0)} 个分块</span><span>${esc(kb.model)}</span><span>${kb.bound?'通用助手已绑定':'未绑定通用助手'}</span></div></div></div><nav class="tabs" aria-label="知识库详情">${['文档','检索测试','配置','处理记录','评测','图片资料'].map(name=>`<button class="${tab===name?'active':''}" aria-current="${tab===name?'page':'false'}" onclick="setTab('${name}')">${name}</button>`).join('')}</nav>${specialState()||content()}`}
function specialState(){if(scenario==='loading')return '<div aria-busy="true"><p class="sub">正在读取资料…</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';if(scenario==='error')return '<div class="empty" role="alert"><h2>暂时无法加载</h2><p>请检查连接后重试，现有资料不会被删除。</p><button onclick="document.querySelector(\'#scenario\').value=\'normal\';scenario=\'normal\';render()">重新加载</button></div>';if(scenario==='empty')return `<div class="empty"><h2>${current===null?'创建第一个知识库':'还没有文档'}</h2><p>${current===null?'按用途归集资料，之后可以让助手引用。':'先上传一份文本资料，再通过检索测试核对内容。'}</p><button class="primary" ${disabled()} onclick="${current===null?'createLibrary()':'upload()'}">${current===null?'新建知识库':'上传文档'}</button></div>`;return ''}
function content(){if(tab==='文档'){const visible=docs.map((d,index)=>({...d,index})).filter(d=>d.name.includes(query)&&(filter==='all'||d.status===filter));return `<div class="row"><div><h2>文档</h2><p class="sub">查看资料是否已完成解析，核对用于检索的分块内容。</p></div><div class="actions"><button ${disabled()} onclick="ocr()">OCR 导入</button><button class="primary" ${disabled()} onclick="upload()">＋ 上传文档</button></div></div><div class="toolbar"><input aria-label="搜索文档" placeholder="搜索文件名" value="${esc(query)}" oninput="query=this.value;renderWithFocus('搜索文档')"><select aria-label="索引状态" onchange="filter=this.value;render()">${[['all','全部状态'],['ready','向量就绪'],['keyword','关键词可用'],['failed','需要处理']].map(([v,n])=>`<option value="${v}" ${filter===v?'selected':''}>${n}</option>`).join('')}</select><small>${visible.length} 个结果</small></div><div class="doc-list"><div class="doc-header"><span>文档名称</span><span>索引状态</span><span>分块 / 修订</span><span>操作</span></div>${visible.map(d=>`<div class="doc-row"><div><button class="file-title" onclick="preview(${d.index})">${esc(d.name)}</button><small>${d.size}${d.status==='failed'?' · 扫描件未提取到正文，请转 OCR 校对导入':''}</small></div><span class="status ${d.status==='failed'?'fail':d.status==='keyword'?'warn':''}">${statusNames[d.status]}</span><span>${d.chunks} 个分块<small>修订 ${d.revision}</small></span><div class="actions"><button onclick="preview(${d.index})">查看分块</button><button aria-label="管理 ${esc(d.name)}" ${disabled()} onclick="manage(${d.index})">管理</button></div></div>`).join('')||'<div class="empty">没有匹配的文档，请调整搜索或筛选条件。</div>'}</div>`}
 if(tab==='检索测试')return `<div class="row"><div><h2>检索测试</h2><p class="sub">核对能否找到正确片段；这里展示检索结果，不生成回答。</p></div><span class="badge">样例 · 混合检索</span></div><div class="split"><form class="section" onsubmit="event.preventDefault();runSearch()"><label>测试问题<textarea id="question" required placeholder="例如：这本书主要讲了什么？"></textarea></label><p>向量与重排模型可能产生用量。检索策略在“配置”中保存。</p><button class="primary">检索测试</button></form><section id="results">${retrieved?searchResults():'<div class="empty"><h2>等待测试问题</h2><p>输入一个资料中能够回答的问题，查看来源片段。</p></div>'}</section></div>`;
 if(tab==='配置')return `<section class="section"><h2>助手使用范围</h2><p>上传只让资料进入本库；启用后通用助手才能引用本库。智能体可使用各自的独立资源配置。</p><label><span><input type="checkbox" ${libraries[current].bound?'checked':''} ${disabled()} onchange="libraries[current].bound=this.checked;notify('样例绑定状态已更新，未写入真实系统')"> 供通用助手使用</span></label></section><section class="section"><h2>索引与检索</h2><p>当前向量模型：${esc(libraries[current].model)}。创建后不在这里直接切换；关键词覆盖率不是向量相似度或答案置信度。</p><label>重排模型<select ${disabled()}><option>不使用重排</option><option>样例：BAAI/bge-reranker-v2-m3</option></select></label><label>最低关键词覆盖率（%）<input type="number" value="0" min="0" max="100" ${disabled()}></label><button ${disabled()} onclick="notify('样例检索策略已保存；正式页面会重新读取接口确认')">保存检索策略</button></section><section class="section"><h2>分块策略</h2><p>影响后续导入和更新；修改设置不代表已有文档已经重新索引。</p><label>分块大小<input type="number" value="1000" ${disabled()}></label><button ${disabled()} onclick="notify('样例分块策略已保存，不修改真实索引')">保存分块策略</button></section>`;
 if(tab==='处理记录')return `<section class="section"><h2>处理记录与用量</h2><p>展示已有导入修订与模型处理用量，不伪造后台任务队列。</p><div class="doc-row"><div>读书笔记.md<small>样例 · 修订 2 · 替换更新</small></div><span class="status">已处理</span><span>12 个分块</span><span class="sub">仅演示记录</span></div></section>`;
 if(tab==='评测')return `<section class="section"><h2>评测题集与检索实验</h2><p>通过固定问题和预期片段比较检索结果；与日常文档维护分开。</p><button ${disabled()} onclick="notify('样例入口：正式实现保留已有题集和实验组件')">管理评测题集</button> <button onclick="notify('样例实验结果，不请求真实模型')">查看检索实验</button></section>`;
 return `<section class="section"><h2>图片资料</h2><p>继续保留现有多模态知识入口；需要已配置兼容的多模态向量模型和相应权限。</p><button ${disabled()} onclick="notify('样例入口：正式页面使用已有图片知识组件')">上传图片资料</button></section>`}
function renderWithFocus(label){const node=document.activeElement,pos=node.selectionStart;render();const next=document.querySelector(`[aria-label="${label}"]`);next.focus();next.setSelectionRange(pos,pos)}
function createLibrary(){openModal('<h2>新建知识库</h2><p class="sub">样例创建，不写入真实系统。</p><form onsubmit="event.preventDefault();libraries.push({name:this.elements.title.value.trim(),description:this.elements.description.value,empty:true,model:\'仅关键词检索\',bound:false});closeModal();scenario=\'normal\';document.querySelector(\'#scenario\').value=\'normal\';render();notify(\'已新增样例知识库，刷新会重置\')"><label>名称<input name="title" required maxlength="100" placeholder="例如：产品帮助中心"></label><label>描述<textarea name="description" placeholder="这里保存哪些资料？"></textarea></label><p class="note">正式页面可在创建时选择向量模型。本Demo不连接模型服务。</p><footer><button type="button" onclick="closeModal()">取消</button><button class="primary">创建知识库</button></footer></form>')}
function upload(){openModal('<h2>上传文档</h2><p class="sub">TXT、Markdown、PDF、DOCX、XLSX · 单文件最多 4 MB</p><form id="upload-form" onsubmit="event.preventDefault();simulateUpload(this)"><label>选择文件<input aria-label="选择上传文件" name="file" type="file" accept=".txt,.md,.pdf,.docx,.xlsx" required></label><p class="note">此为样例，只检查文件名和大小，不读取或上传文件正文。扫描件可通过OCR入口校对后导入。</p><p role="status" id="upload-status"></p><footer><button type="button" onclick="closeModal()">取消</button><button class="primary">开始上传</button></footer></form>')}
function simulateUpload(form){const file=form.file.files[0],status=document.querySelector('#upload-status');if(file.size>4*1024*1024){status.textContent='文件超过4MB，请缩小后重新选择。';return}if(!/\.(txt|md|pdf|docx|xlsx)$/i.test(file.name)){status.textContent='文件类型不支持，请选择支持的文档。';return}form.querySelectorAll('button,input').forEach(n=>n.disabled=true);status.textContent='样例：正在上传并处理…';setTimeout(()=>{docs.push({name:file.name,size:Math.max(1,Math.round(file.size/1024))+' KB',chunks:1,revision:1,status:'keyword'});closeModal();scenario='normal';document.querySelector('#scenario').value='normal';render();notify('样例处理完成，文件正文没有读取或上传')},900)}
function preview(index){const doc=docs[index];openModal(`<h2>${esc(doc.name)}</h2><p class="sub">分块预览 · 修订 ${doc.revision} · 样例资料</p><div class="tabs"><button class="active" onclick="document.querySelector('#preview-body').innerHTML='<h3>片段 #1</h3><pre>样例片段：将资料分块后，助手只检索与问题相关的部分。正式页面读取真实文档分块。</pre>'">分块内容</button><button onclick="document.querySelector('#preview-body').textContent='样例修订记录：当前修订 ${doc.revision}；正式页面读取真实更新历史。'">修订历史</button></div><div id="preview-body"><h3>片段 #1</h3><pre>样例片段：将资料分块后，助手只检索与问题相关的部分。正式页面读取真实文档分块。</pre></div><footer><button onclick="closeModal()">返回文档列表</button></footer>`)}
function manage(index){const doc=docs[index];openModal(`<h2>管理文档</h2><p class="sub">${esc(doc.name)}</p><div class="section"><button onclick="closeModal();upload()">更新文档（演示）</button><p>正式页面替换当前文档并保留修订历史；演示上传不会真实替换。</p></div><div class="section"><button onclick="notify('样例已发起重索引，不请求真实服务');closeModal()">重新索引</button><p>使用已保存分块和向量配置，不等同于重新OCR。</p></div><button style="color:#a63825" onclick="removeDoc(${index})">删除文档</button>`)}
function removeDoc(index){if(confirm('只删除样例：'+docs[index].name+'？')){docs.splice(index,1);closeModal();render();notify('样例文档已删除，真实文档不受影响')}}
function ocr(){openModal('<h2>OCR 导入</h2><p class="sub">扫描件及图片先识别、校对，再确认导入。</p><p class="note">正式系统保留已有OCR上传与校对导入。需要先配置支持的识别模型或服务，可能产生模型用量；此Demo不会调用OCR。</p><footer><button onclick="closeModal()">返回文档</button></footer>')}
function searchResults(){return '<p class="sub">样例结果 · 1 个片段 · 非实时检索</p><article class="result"><small>来源：长安的荔枝 · 阅读资料.txt / 片段 #1</small><h3>一场运送荔枝的差事</h3><p>样例摘要：主人公为完成运送任务，在时效、距离与各方利益之间寻找办法。正式检索页应展示原文片段，而非编造的模型回答。</p><span class="badge">演示分数 0.86 · 非置信度</span></article>'}
function runSearch(){retrieved=true;document.querySelector('#results').innerHTML=searchResults()}
document.querySelector('#scenario').onchange=event=>{scenario=event.target.value;render()};render();
</script>
</body></html>
