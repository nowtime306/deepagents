<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行 · 平台扩展交互设计</title>
<style>
:root{font:14px Inter,"Microsoft YaHei",sans-serif;color:#292724;background:#f8f8f7;--line:#e6e3df;--muted:#79736d;--accent:#b6422d}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:9px 13px}button:hover{background:#f1eeeb}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus,select:focus{outline:2px solid #bd735f;outline-offset:2px}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:7px;max-width:100%;background:white}input{min-width:0}textarea{width:100%;min-height:70px}label{display:grid;gap:8px;margin:15px 0}.primary{background:var(--accent);color:white;border-color:var(--accent)}.shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:100vh}aside{background:#f0efed;border-right:1px solid var(--line);padding:25px 15px}aside strong{display:block;font-size:24px;padding:0 12px;margin-bottom:30px}aside p{font-size:11px;color:var(--muted);padding:0 12px;margin-top:25px}aside button{width:100%;text-align:left;background:none;border:0;margin:4px 0}.active{background:#f3e4df!important;color:#a63825!important}main{min-width:0}header{padding:19px 30px;background:white;border-bottom:1px solid var(--line)}.banner{background:#fcf4df;color:#765e27;padding:11px 30px;font-size:12px}.banner strong{margin-right:8px}.frame{max-width:1280px;padding:32px;margin:auto}.heading,.toolbar,.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar{justify-content:flex-start;margin:22px 0}.toolbar input{flex:1;max-width:360px}.toolbar small{margin-left:auto}.sub,small{color:var(--muted);line-height:1.7}h1{font-size:27px;letter-spacing:-.5px;margin:8px 0}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 8px}p{line-height:1.7}.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:4px 7px;display:inline-block;white-space:nowrap;color:var(--muted)}.ok{background:#edf5ed;color:#396640;border-color:#d1e1d0}.warn{background:#fff3df;color:#8c631c;border-color:#ebd5a7}.bad{background:#fff0eb;color:#a53b29;border-color:#ebc6bb}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:20px}.card{cursor:pointer;text-align:left}.number{display:block;font-size:28px;font-weight:650;margin:11px 0 5px}.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin:18px 0}.bars{height:150px;display:flex;gap:10px;align-items:flex-end;padding:20px 0 8px}.bars i{display:block;background:#cc9789;flex:1;border-radius:4px 4px 0 0}.grid-list{display:grid;gap:10px}.item{display:grid;grid-template-columns:minmax(0,1fr) 140px minmax(100px,.6fr) auto;gap:18px;align-items:center;background:white;border:1px solid var(--line);border-radius:9px;padding:18px}.item strong{display:block;overflow-wrap:anywhere}.item small{display:block;margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;padding:55px 20px;border:1px dashed var(--line);border-radius:10px;background:white}.skeleton{height:80px;border-radius:10px;background:#ece9e5;margin:14px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs button{white-space:nowrap}.detail{border-left:3px solid var(--accent);padding-left:16px}.progress{height:8px;background:#f0efec;border-radius:9px;margin:10px 0}.progress span{display:block;background:#9eae94;height:100%;border-radius:9px}.overlay{position:fixed;inset:0;background:#0004;z-index:5;display:flex;justify-content:flex-end}.drawer{width:min(520px,100%);height:100%;background:white;padding:26px;overflow:auto;box-shadow:-12px 0 50px #0001}.drawer .heading{position:sticky;top:-26px;background:white;padding:16px 0;border-bottom:1px solid var(--line);z-index:1}.drawer footer{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;padding-top:20px;border-top:1px solid var(--line)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#292724;color:white;padding:12px 20px;border-radius:9px;z-index:9;max-width:90%}.mobile-nav{display:none}.hint{padding:12px;background:#f7f5f2;border-radius:8px;color:var(--muted);font-size:12px}.check{display:flex;gap:10px;align-items:center}.check input{width:auto}.muted{color:var(--muted)}.hidden{display:none}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.item{grid-template-columns:minmax(0,1fr) auto}.item>:nth-child(3){grid-column:1}.shell{grid-template-columns:175px minmax(0,1fr)}.frame{padding:24px}}@media(max-width:650px){.shell{display:block}aside{display:none}.frame{padding:20px 14px}header,.banner{padding:15px}.mobile-nav{display:block;width:100%;margin-top:12px}.cards{gap:8px}.card{padding:13px}.number{font-size:23px}.item{gap:10px;padding:14px}.toolbar input{flex-basis:100%;max-width:none}.toolbar small{margin-left:0}.drawer{padding:18px}.heading>button{margin-left:auto}.tag{white-space:normal}}
</style></head><body><div class="shell"><aside><strong>✦ 知行</strong><p>工作空间</p><button onclick="notify('演示保留现有聊天入口，不连接业务接口')">＋ 新建对话</button><p>管理与观测</p><nav id="nav"></nav><p>设计说明</p><small>参考 Dify · Open WebUI<br>n8n · Langfuse<br>不复制上游品牌或素材</small></aside><main><header><strong id="breadcrumb">运营管理 / 监测大盘</strong><select class="mobile-nav" aria-label="切换功能" id="mobile-nav"></select></header><div class="banner"><strong>交互设计 Demo · 全部为样例数据</strong>不连接真实服务，不存储密码/密钥，刷新即重置；界面设计不代表工程已完成。</div><div class="frame"><div class="toolbar"><label style="display:inline;margin:0">场景 <select id="scenario" aria-label="演示场景"><option value="normal">正常</option><option value="empty">空数据</option><option value="loading">加载中</option><option value="error">加载失败</option><option value="stale">采集过期</option><option value="readonly">只读账号</option></select></label><small id="scope">平台管理员视角 · 样例</small></div><div id="app"></div></div></main></div><div id="layer"></div><div id="toast" role="status" hidden></div>
<script>
const pages=['监测大盘','告警中心','认证与安全','工具连接','模型兼容矩阵','图片与视频检索','费用与账单','部署与容量','检索质量'];
let page='监测大盘',scenario='normal',query='',windowLabel='过去1小时',section='规则',selectedType='OIDC 企业登录';
const rules=[{name:'执行后台失联',type:'服务心跳',value:'超过 45 秒',state:'启用'},{name:'队列等待过长',type:'队列最老等待',value:'超过 120 秒',state:'启用'}];
const events=[{name:'代码任务资源等待',type:'内存预留接近预算',value:'样例 7.27 GiB 可用',state:'未处理'}];
const connections=[{name:'研发资料工具',type:'Streamable HTTP',value:'3 个已授权工具',state:'已授权'},{name:'本地文档解析',type:'隔离 stdio',value:'受管执行环境',state:'待检测'},{name:'审阅 Agent',type:'ACP v1',value:'会话 / 提问 / 取消',state:'待检测'}];
const app=document.querySelector('#app'),layer=document.querySelector('#layer');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ro=()=>scenario==='readonly';const dis=()=>ro()?'disabled':'';
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3500)}
function navigate(p){page=p;query='';section='规则';closeDrawer();render()}
function closeDrawer(){layer.innerHTML=''}
function drawer(title,body,save){layer.innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="heading"><h2>${esc(title)}</h2><button aria-label="关闭侧栏" onclick="closeDrawer()">×</button></div>${body}<footer><button onclick="closeDrawer()">取消</button>${save?`<button class="primary" ${dis()} onclick="${save}">保存样例</button>`:''}</footer></section></div>`;layer.querySelector('button').focus()}
function heading(title,sub,action='',code=''){return `<div class="heading"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${action?`<button class="primary" ${dis()} onclick="${code}">＋ ${action}</button>`:''}</div>`}
function toolbar(placeholder){return `<div class="toolbar"><input aria-label="搜索列表" placeholder="${placeholder}" value="${esc(query)}" oninput="search(this.value)"><span class="tag">${ro()?'只读 · 修改操作不可用':'列表优先 · 查看详情后配置'}</span></div>`}
function search(v){query=v;render();const i=app.querySelector('[aria-label="搜索列表"]');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
function tabs(names){return `<div class="tabs">${names.map(n=>`<button class="${section===n?'active':''}" onclick="section='${n}';render()">${n}</button>`).join('')}</div>`}
function list(items,button,code){const found=items.map((v,i)=>({...v,index:i})).filter(v=>(v.name+v.type).includes(query));return `<div class="grid-list">${found.map(v=>`<div class="item"><div><strong>${esc(v.name)}</strong><small>${esc(v.type)}</small></div><span class="tag ${v.state==='已恢复'||v.state==='已授权'?'ok':v.state==='未处理'?'warn':''}">${esc(v.state)}</span><small>${esc(v.value)}</small><button onclick="${code.replaceAll('$i',String(v.index))}">${button}</button></div>`).join('')||'<div class="empty">没有匹配记录，调整搜索条件后重试。</div>'}</div>`}
function special(){if(scenario==='loading')return '<div aria-busy="true"><p>正在读取样例…</p><div class="skeleton"></div><div class="skeleton"></div></div>';if(scenario==='error')return '<div class="empty" role="alert"><h2>暂时无法加载</h2><p>已有配置保留；无法采集不等于系统健康。</p><button onclick="setScenario(\'normal\')">重试样例</button></div>';if(scenario==='empty')return '<div class="empty"><h2>暂无数据</h2><p>没有样本时不显示100%成功率或零费用。</p><button onclick="setScenario(\'normal\')">查看样例状态</button></div>';return ''}
function setScenario(s){scenario=s;document.querySelector('#scenario').value=s;render()}
function render(){document.querySelector('#nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')">${p}</button>`).join('');document.querySelector('#mobile-nav').innerHTML=pages.map(p=>`<option ${p===page?'selected':''}>${p}</option>`).join('');document.querySelector('#breadcrumb').textContent='运营与设置 / '+page;document.querySelector('#scope').textContent=ro()?'只读账号视角 · 无修改权限':'平台管理员视角 · 样例';const top=heading(page,descriptions[page],newButtons[page]||'',newCodes[page]||'');app.innerHTML=top+(scenario==='stale'?'<p class="hint" role="alert">样例采集已过期，最近值仅供核对；不显示为当前健康。请先检查采集器。</p>':'')+(special()||content())}
const descriptions={'监测大盘':'先看运行是否正常，再定位等待、失败、Token与费用。','告警中心':'规则、触发、确认与恢复分别记录；确认不代表指标恢复。','认证与安全':'企业登录、个人验证及找回通道各自配置。','工具连接':'明确真实协议与授权范围，命令只在受管环境运行。','模型兼容矩阵':'按用途和真实协议判断能否执行，不把保存成功当作服务可用。','图片与视频检索':'使用固定模型的图片向量检索资料，视频结果定位到帧。','费用与账单':'Token与额外服务分项统计，未知费用单列，币种不混算。','部署与容量':'查看实际实例与故障域，容量快照不等于吞吐承诺。','检索质量':'区分合成与真实题集，检索命中不能代替引用正确率。'};
const newButtons={'告警中心':'新增规则','认证与安全':'新增认证来源','工具连接':'新增连接','费用与账单':'新增价格版本'};const newCodes={'告警中心':'editRule()','认证与安全':'securityConfig()','工具连接':'connectionConfig()','费用与账单':'priceConfig()'};
function content(){if(page==='监测大盘')return `<div class="toolbar"><select aria-label="统计时间范围" onchange="windowLabel=this.value;render()">${['过去1小时','过去24小时','过去7天'].map(v=>`<option ${v===windowLabel?'selected':''}>${v}</option>`).join('')}</select><button onclick="notify('已刷新样例；真实页面将显示采集时间')">刷新</button><small>${windowLabel} · 样例统计，非实时采集</small></div><div class="cards">${[['服务就绪',scenario==='stale'?'待核查':'4 / 4','就绪与存活分别检查'],['待执行任务','3','其中 1 项资源等待'],['输入 / 输出 Token','21,957 / 2,550','另有 1 次用量未知'],['已计价部分费用','¥ 0.38','不含 2 次未计价调用']].map(([a,b,c])=>`<button class="card" onclick="metricDetail('${a}')"><small>${a}</small><span class="number">${b}</span><small>${c}</small></button>`).join('')}</div><div class="split"><div class="panel"><div class="row"><h2>运行完成趋势</h2><small>固定示例 · 12个时间桶</small></div><div class="bars" role="img" aria-label="样例运行趋势，非实时数据">${[30,55,42,75,58,100,80,125,95,110,70,90].map(n=>`<i style="height:${n}px"></i>`).join('')}</div><div class="row"><small>成功 18 · 失败 1 · 样本 19</small><small>完成耗时 P95：8.4s（样例）</small></div></div><div class="panel"><h2>资源与执行预算</h2><p>CPU：24% · 可用内存：7.27 GiB · 磁盘：128 GiB</p><div class="progress"><span style="width:68%"></span></div><p class="sub">浏览器预留3 GiB，代码任务需要5 GiB。合计超预算时等待，不绕过限制。</p><button onclick="navigate('部署与容量')">查看实例与预算</button></div></div><h2>平台后台</h2>${list(['API','Ask','Work','Ops'].map(v=>({name:v,type:'本机节点 / '+v.toLowerCase(),value:scenario==='stale'?'超过45秒未更新':'最近心跳 8秒前 · 样例',state:scenario==='stale'?'过期':'就绪'})),'查看','metricDetail(\'服务就绪\')')}`;
if(page==='告警中心')return tabs(['规则','事件'])+toolbar('搜索告警名称')+(section==='规则'?list(rules,'配置','editRule($i)'):list(events,'处理','eventDetail($i)'));
if(page==='认证与安全')return toolbar('搜索认证方式')+list([{name:'企业统一登录',type:'OIDC · 授权码',state:'待配置',value:'不按相同邮箱自动合并账号'},{name:'双因素验证',type:'TOTP / 一次恢复码',state:'未开启',value:'先确认当前身份再绑定'},{name:'密码找回',type:'邮件 / 短信通道',state:'待配置',value:'仅验证过的本人联系方式'}],'配置','securityDetail($i)');
if(page==='工具连接')return toolbar('搜索连接名称或协议')+list(connections,'详情','connectionDetail($i)');
if(page==='模型兼容矩阵')return toolbar('搜索用途或协议')+list([{name:'文本向量 / 重排',type:'OpenAI兼容',state:'可执行',value:'真实可用性仍需测试模型'},{name:'多模态向量',type:'DashScope原生',state:'业务检测',value:'在知识库使用样例图片检测'},{name:'自定义原生协议',type:'未知协议',state:'仅保存配置',value:'未适配时明确拒绝调用'}],'查看边界','metricDetail(\'模型兼容边界\')');
if(page==='图片与视频检索')return `<div class="tabs"><button class="active">检索测试</button><button onclick="notify('演示：真实页面复用知识库处理记录')">处理记录</button></div><div class="panel"><h2>查询资料</h2><p class="sub">此处是知识库资料检索，不恢复独立图片理解或语音页面。</p><label>查询方式<select id="query-type" onchange="document.querySelector('#image-field').hidden=this.value==='文字查询'"><option>文字查询</option><option>图片查询</option></select></label><label>查询内容<input placeholder="例如：红色产品包装" aria-label="资料查询内容"></label><label id="image-field" hidden>查询图片<input type="file" accept="image/png,image/jpeg,image/webp"></label><button class="primary" onclick="searchMedia()">检索样例</button><div id="media-results"></div></div>`;
if(page==='费用与账单')return `<div class="toolbar"><select aria-label="费用币种"><option>CNY</option><option>USD</option></select><button ${dis()} onclick="billImport()">导入账单</button><button onclick="billDetail()">查看差异</button><small>未知金额不填零 · 不自动换汇</small></div>`+list([{name:'Token输入/输出',type:'原有价格版本',state:'已计价',value:'示例 ¥0.30'},{name:'联网搜索',type:'按次 · 版本固定',state:'待定价',value:'2次数量已知 / 金额未知'},{name:'图片生成',type:'按张',state:'待接入',value:'无本轮样本'}],'详情','billDetail()');
if(page==='部署与容量')return `<p class="hint">当前设计默认本机部署。多个进程不代表物理多机高可用；共享附件、向量单写与故障域需分别验证。</p>`+list([{name:'本机节点',type:'Windows · 当前工作区',state:'在线样例',value:'API / Ask / Work / Ops'},{name:'监测栈',type:'可选 Prometheus / Grafana',state:'未启用样例',value:'默认不强制占用执行预算'},{name:'容量验证',type:'并发 / 持续时间 / 峰值',state:'待执行样例',value:'P95与排队数量分开报告'}],'详情','metricDetail(\'部署与容量\')');
return `<div class="toolbar"><select aria-label="题集来源"><option>合成样例题集</option><option>真实业务题集 · 未接入</option></select><button ${dis()} onclick="qualityGate()">设置质量门禁</button></div><div class="cards">${[['检索 Recall@10','93.33%','合成样例，非真实质量结论'],['引用正确率','未标注','不能从命中率推断'],['无答案误召回','需要优化','单独查看负例，不刷空结果'],['真实样本数','0','真实验收需至少50题']].map(([a,b,c])=>`<div class="card"><small>${a}</small><span class="number">${b}</span><small>${c}</small></div>`).join('')}</div><div class="panel"><h2>门禁状态：未验收</h2><p>目标Recall@10 ≥90%、引用正确率 ≥95%。真实题集未接入及引用未标注时不显示通过。</p><button onclick="notify('演示：实际页面将下钻已有评测实验的逐题证据')">查看错误样本</button></div>`}
function metricDetail(name){drawer(name,`<p class="hint">样例详情，无实时采集。</p><p>统计范围：${windowLabel}。权限范围：${ro()?'本人可见':'管理员汇总'}。</p><p>真实实现需返回采集时间、样本数、未知数量与过期标记；不能将未采集值显示为0。</p><div class="detail"><h3>定位下一步</h3><p>查看对应服务、运行记录或调用账本；不暴露对话正文和密钥。</p></div>`)}
function editRule(index){const item=rules[index];drawer(item?'编辑告警规则':'新增告警规则',`<label>规则名称<input id="rule-name" value="${esc(item?.name||'')}" placeholder="例如：待执行任务等待过长"></label><label>监测指标<select><option>服务心跳</option><option>队列最老等待</option><option>失败率</option><option>可用内存</option></select></label><label>阈值<input id="threshold" type="number" min="1" value="120"></label><label>持续时间（秒）<input type="number" min="0" value="30"></label><label>冷却时间（秒）<input type="number" min="1" value="300"></label><label>通知渠道<select><option>站内通知</option><option>已有签名Webhook · 需配置</option></select></label><p class="sub">事件确认不解除异常；重启后应保留规则与事件状态。</p>`,`saveRule(${Number.isInteger(index)?index:-1})`)}
function saveRule(index){const name=layer.querySelector('#rule-name').value.trim();if(!name){notify('请输入规则名称');return}const value={name,type:'队列最老等待',value:'超过 '+layer.querySelector('#threshold').value+' 秒',state:'启用'};if(index<0)rules.unshift(value);else rules[index]=value;closeDrawer();render();notify('仅保存到本页样例，刷新后重置')}
function eventDetail(i){drawer('告警事件',`<h3>${esc(events[i].name)}</h3><p>当前状态：${events[i].state}</p><p>样例事件：首次触发13:00，最近采集13:02。</p><p class="sub">已确认不等于已恢复；真实页面根据后续指标生成恢复事件。</p><button ${dis()} onclick="events[${i}].state='已确认';closeDrawer();render();notify('样例已确认，异常仍需处理')">确认事件</button>`)}
function securityConfig(){drawer('新增认证来源',`<label>显示名称<input placeholder="例如：企业统一登录"></label><label>协议<select><option>OpenID Connect</option></select></label><label>Issuer<input placeholder="https://identity.example.com"></label><label>Client ID<input autocomplete="off"></label><label>Client Secret<input type="password" autocomplete="new-password" placeholder="Demo不保存任何凭证"></label><label>新账号策略<select><option>仅允许显式绑定已有账号</option><option>允许注册为最小权限账号</option></select></label><p class="hint">回调验证state/nonce/PKCE与ID Token；不得凭同名邮箱自动合并管理员。</p>`,`saveSample()`)}
function securityDetail(i){if(i===0)return securityConfig();if(i===1)return drawer('双因素验证',`<p>演示流程：重新验证当前身份 → 设置验证器 → 输入有效码 → 一次展示恢复码。</p><label>当前密码<input type="password" autocomplete="current-password" placeholder="请勿在Demo输入真实密码"></label><label>验证器动态码<input inputmode="numeric" placeholder="6位动态码（样例）"></label><p class="hint">本Demo不会生成真实密钥、恢复码或修改登录设置。</p>`,`saveSample()`);drawer('密码找回通道',`<label>通道<select><option>SMTP邮件</option><option>签名短信Webhook</option></select></label><label>通道显示名称<input placeholder="企业找回服务"></label><p class="hint">仅已验证联系方式可恢复；统一请求返回防止账号枚举。验证码限时、一次使用、限流，不解除MFA。</p>`,`saveSample()`)}
function connectionConfig(){drawer('新增工具连接',`<label>名称<input placeholder="研发资料工具"></label><label>真实协议<select id="transport" onchange="transportFields()"><option>Streamable HTTP</option><option>旧HTTP+SSE</option><option>隔离 stdio</option><option>ACP v1</option></select></label><div id="transport-fields"><label>服务地址<input placeholder="https://example.com/mcp"></label></div><label>认证方式<select><option>无认证</option><option>加密Token</option><option>OAuth授权（HTTP）</option></select></label><p class="hint">只读Ask与经审批Work写权限继续生效，未知执行结果不自动重放。</p>`,`saveSample()`)}
function transportFields(){const type=document.querySelector('#transport').value;document.querySelector('#transport-fields').innerHTML=type==='隔离 stdio'||type==='ACP v1'?'<label>批准的运行配置<select><option>受管镜像 / 离线样例工具</option></select></label><p class="hint">只在隔离执行环境启动；不接受宿主任意命令或暗中安装包。</p>':'<label>服务地址<input placeholder="https://example.com/mcp"></label>'}
function connectionDetail(i){drawer(connections[i].name,`<p>协议：${esc(connections[i].type)}</p><p>${esc(connections[i].value)}</p><p>连接检测、工具发现和业务验证分别记录。</p><button ${dis()} onclick="notify('样例：打开授权页前确认服务身份、scope和返回地址')">授权 / 重新授权</button><p class="sub">真实OAuth凭证不会在模型上下文或详情返回中显示。</p>`)}
function priceConfig(){drawer('新增额外费用版本',`<label>计费项目<input placeholder="例如：联网搜索"></label><label>计费单位<select><option>每次</option><option>每张图片</option><option>每秒音频</option><option>每秒视频</option></select></label><label>单价<input type="number" step="0.0001" min="0"></label><label>币种<select><option>CNY</option><option>USD</option></select></label><label>价格来源<input placeholder="官方价格页或合同说明，不填密钥"></label><p class="hint">版本固定，不重算已结算历史；未知数量/价格不显示免费。</p>`,`saveSample()`)}
function billImport(){drawer('账单导入预览',`<label>账单文件<input type="file" accept=".csv,.json"></label><p class="hint">Demo不读取或上传文件。真实流程先校验字段映射、币种、调用ID和时间，再确认导入；重复账单幂等。</p><button onclick="billDetail()">查看样例差异预览</button>`)}
function billDetail(){drawer('账单差异（样例）',`<div class="detail"><p>平台已计价：¥0.38</p><p>供应商账单：¥0.40</p><p>差异：¥0.02 · 需核对</p><p>另有2次未计价，不参与一致结论。</p></div><p class="sub">不自动改历史账本、不自动换汇、不重复导入。</p>`)}
function qualityGate(){drawer('检索质量门禁',`<label>Recall@10最低值（%）<input type="number" min="0" max="100" value="90"></label><label>引用正确率最低值（%）<input type="number" min="0" max="100" value="95"></label><label>最少真实题数<input type="number" min="1" value="50"></label><p class="hint">未标注引用和无真实题集时状态为未验收，不因合成题过线显示通过。</p>`,`saveSample()`)}
function searchMedia(){document.querySelector('#media-results').innerHTML='<div class="detail" style="margin-top:24px"><h3>样例结果 · 产品介绍视频.mp4</h3><p>匹配帧00:12 · 相似度0.83（示例分数，不是答案置信度）</p><p class="sub">真实结果需匹配库内同模型/维度索引；返回可定位帧与私有来源。</p></div>'}
function saveSample(){closeDrawer();notify('已演示保存流程；Demo不持久化设置或凭证')}
document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;closeDrawer();render()};document.querySelector('#mobile-nav').onchange=e=>navigate(e.target.value);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});render();
</script></body></html>
